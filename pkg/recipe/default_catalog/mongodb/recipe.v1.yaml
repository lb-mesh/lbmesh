recipe: v1
metadata:
  name: mongodb
  category: database
  description: MongoDB document database with root authentication enabled.
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 256
  recommended_memory_mb: 512
  min_cpus: 1
container:
  image: mongo:7
  environment:
    MONGO_INITDB_ROOT_USERNAME: root
    MONGO_INITDB_ROOT_PASSWORD: changeme
  ports:
    - container: 27017
      host: 27017
      protocol: tcp
  volumes:
    - /data/db
    - /data/configdb
outputs:
  env:
    MONGODB_URI: mongodb://root:changeme@localhost:27017/?authSource=admin
  instructions: MongoDB is running on localhost:27017 (user root).
addons:
  - name: admin
    description: mongo-express web UI for MongoDB.
    resources:
      min_memory_mb: 64
      recommended_memory_mb: 128
      min_cpus: 1
    container:
      image: mongo-express:1
      environment:
        ME_CONFIG_MONGODB_URL: mongodb://root:changeme@mongodb:27017/?authSource=admin
        ME_CONFIG_BASICAUTH_USERNAME: admin
        ME_CONFIG_BASICAUTH_PASSWORD: changeme
      ports:
        - container: 8081
          host: 8100
          protocol: tcp
    outputs:
      instructions: mongo-express is running on http://localhost:8100 (admin / changeme).
