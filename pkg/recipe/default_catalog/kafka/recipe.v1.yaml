recipe: v1
metadata:
  name: kafka
  category: messaging
  description: Apache Kafka event streaming broker (single node, KRaft mode).
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 768
  recommended_memory_mb: 1536
  min_cpus: 1
container:
  image: apache/kafka:3.8.0
  environment:
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: broker,controller
    # PLAINTEXT serves host clients; INTERNAL serves containers on the lbmesh
    # network, which reach the broker by the recipe name.
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://localhost:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_LOG_DIRS: /var/lib/kafka/data
  ports:
    - container: 9092
      host: 9092
      protocol: tcp
  volumes:
    - /var/lib/kafka/data
outputs:
  env:
    KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  instructions: Kafka is running on localhost:9092 (containers on the lbmesh network use kafka:19092).
addons:
  - name: admin
    description: Kafka UI for browsing topics, consumers and messages.
    resources:
      min_memory_mb: 256
      recommended_memory_mb: 512
      min_cpus: 1
    container:
      image: ghcr.io/kafbat/kafka-ui:v1.0.0
      environment:
        KAFKA_CLUSTERS_0_NAME: lbmesh
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      ports:
        - container: 8080
          host: 8170
          protocol: tcp
    outputs:
      instructions: Kafka UI is running on http://localhost:8170.
