recipe: v1
metadata:
  name: openldap
  category: auth
  description: OpenLDAP directory server with a starter users and groups tree.
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 64
  recommended_memory_mb: 256
  min_cpus: 1
container:
  # Bitnami's free OpenLDAP image moved to the frozen bitnamilegacy repository.
  image: bitnamilegacy/openldap:2.6.10
  environment:
    LDAP_ROOT: dc=example,dc=org
    LDAP_ADMIN_USERNAME: admin
    LDAP_ADMIN_PASSWORD: changeme
    LDAP_USER_OU: users
    LDAP_GROUP_OU: groups
    LDAP_USERS: appuser
    LDAP_PASSWORDS: changeme
    LDAP_GROUP: readers
  ports:
    - container: 1389
      host: 1389
      protocol: tcp
  volumes:
    - /bitnami/openldap
  files:
    # Runs once on first start, while slapd is stopped. phpLDAPadmin only logs
    # in as DNs that exist, so give the admin (root) DN its own entry.
    - path: /docker-entrypoint-initdb.d/10-admin-entry.sh
      mode: "0755"
      content: |
        #!/bin/bash
        set -eo pipefail
        . /opt/bitnami/scripts/libopenldap.sh
        eval "$(ldap_env)"
        ldap_start_bg
        ldapadd -x -H "ldapi:///" -D "$LDAP_ADMIN_DN" -w "$LDAP_ADMIN_PASSWORD" <<LDIF
        dn: $LDAP_ADMIN_DN
        objectClass: organizationalRole
        cn: $LDAP_ADMIN_USERNAME
        description: Directory administrator
        LDIF
        ldap_stop
outputs:
  env:
    LDAP_URL: ldap://localhost:1389
    LDAP_BASE_DN: dc=example,dc=org
    LDAP_BIND_DN: cn=admin,dc=example,dc=org
    LDAP_BIND_PASSWORD: changeme
  instructions: >-
    OpenLDAP is running on ldap://localhost:1389 with base dc=example,dc=org.
    Bind as cn=admin,dc=example,dc=org / changeme; user
    cn=appuser,ou=users,dc=example,dc=org / changeme is in group
    cn=readers,ou=groups,dc=example,dc=org.
addons:
  - name: admin
    description: phpLDAPadmin web UI for OpenLDAP.
    resources:
      min_memory_mb: 128
      recommended_memory_mb: 256
      min_cpus: 1
    container:
      image: phpldapadmin/phpldapadmin:2.3.11
      environment:
        LDAP_HOST: openldap
        LDAP_PORT: "1389"
        LDAP_BASE_DN: dc=example,dc=org
        LDAP_USERNAME: cn=admin,dc=example,dc=org
        LDAP_PASSWORD: changeme
        # Log in with a full DN rather than a uid.
        LDAP_LOGIN_ATTR: dn
      ports:
        - container: 8080
          host: 8130
          protocol: tcp
    outputs:
      instructions: phpLDAPadmin is running on http://localhost:8130 (log in as cn=admin,dc=example,dc=org / changeme).
