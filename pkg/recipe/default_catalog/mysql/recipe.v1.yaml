recipe: v1
metadata:
  name: mysql
  category: database
  description: Relational MySQL database service.
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 512
  recommended_memory_mb: 1024
  min_cpus: 1
container:
  image: mysql:8.4
  environment:
    MYSQL_ROOT_PASSWORD: changeme
    MYSQL_ROOT_HOST: "%"
    MYSQL_DATABASE: appdb
    MYSQL_USER: appuser
    MYSQL_PASSWORD: changeme
  ports:
    - container: 3306
      host: 3306
      protocol: tcp
  volumes:
    - /var/lib/mysql
outputs:
  env:
    MYSQL_URL: mysql://appuser:changeme@localhost:3306/appdb
  instructions: MySQL is running on localhost:3306.
addons:
  - name: admin
    description: phpMyAdmin web UI for MySQL.
    resources:
      min_memory_mb: 64
      recommended_memory_mb: 128
      min_cpus: 1
    container:
      image: phpmyadmin:5
      environment:
        PMA_HOST: mysql
      ports:
        - container: 80
          host: 8120
          protocol: tcp
    outputs:
      instructions: phpMyAdmin is running on http://localhost:8120 (log in as root / changeme).
