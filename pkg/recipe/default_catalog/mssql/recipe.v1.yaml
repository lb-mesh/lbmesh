recipe: v1
metadata:
  name: mssql
  category: database
  description: Microsoft SQL Server (Developer edition).
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 2048
  recommended_memory_mb: 4096
  min_cpus: 2
container:
  image: mcr.microsoft.com/mssql/server:2022-latest
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_PID: Developer
    # SQL Server rejects passwords without upper, lower, digit and symbol.
    MSSQL_SA_PASSWORD: Changeme@1234
  ports:
    - container: 1433
      host: 1433
      protocol: tcp
  volumes:
    - /var/opt/mssql
outputs:
  env:
    MSSQL_CONNECTION_STRING: Server=localhost,1433;User Id=sa;Password=Changeme@1234;TrustServerCertificate=True
  instructions: SQL Server is running on localhost:1433 (user sa). The image is amd64-only and runs under emulation on Apple Silicon.
