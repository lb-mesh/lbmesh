recipe: v1
metadata:
  name: elasticsearch
  category: database
  description: Elasticsearch search and analytics engine (single node, security disabled).
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 1024
  recommended_memory_mb: 2048
  min_cpus: 1
container:
  image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
  environment:
    discovery.type: single-node
    cluster.name: lbmesh-cluster
    node.name: lbmesh-elasticsearch
    xpack.security.enabled: "false"
    ES_JAVA_OPTS: -Xms512m -Xmx512m
  ports:
    - container: 9200
      host: 9200
      protocol: tcp
  volumes:
    - /usr/share/elasticsearch/data
outputs:
  env:
    ELASTICSEARCH_URL: http://localhost:9200
  instructions: Elasticsearch is running on http://localhost:9200.
addons:
  - name: admin
    description: Kibana web UI for Elasticsearch.
    resources:
      min_memory_mb: 512
      recommended_memory_mb: 1024
      min_cpus: 1
    container:
      image: docker.elastic.co/kibana/kibana:8.15.0
      environment:
        ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ports:
        - container: 5601
          host: 8160
          protocol: tcp
    outputs:
      instructions: Kibana is running on http://localhost:8160.
