recipe: v1
metadata:
  name: redis
  category: cache
  description: In-memory Redis data store and cache.
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 256
  recommended_memory_mb: 512
  min_cpus: 1
container:
  image: redis:7-alpine
  ports:
    - container: 6379
      host: 6379
      protocol: tcp
outputs:
  env:
    REDIS_URL: redis://localhost:6379
  instructions: Redis is running on localhost:6379.
addons:
  - name: admin
    description: Redis Commander web UI for Redis.
    resources:
      min_memory_mb: 64
      recommended_memory_mb: 128
      min_cpus: 1
    container:
      image: rediscommander/redis-commander:latest
      environment:
        REDIS_HOSTS: local:redis:6379
      ports:
        - container: 8081
          host: 8140
          protocol: tcp
    outputs:
      instructions: Redis Commander is running on http://localhost:8140.
