recipe: v1
metadata:
  name: postgresql
  category: database
  description: Relational PostgreSQL database service.
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 512
  recommended_memory_mb: 1024
  min_cpus: 1
container:
  image: postgres:15-alpine
  environment:
    POSTGRES_PASSWORD: changeme
    POSTGRES_DB: appdb
    POSTGRES_USER: appuser
  ports:
    - container: 5432
      host: 5432
      protocol: tcp
  volumes:
    - /var/lib/postgresql/data
outputs:
  env:
    DATABASE_URL: postgres://appuser:changeme@localhost:5432/appdb
  instructions: PostgreSQL is running on localhost:5432.
addons:
  - name: admin
    description: pgAdmin web UI for PostgreSQL.
    resources:
      min_memory_mb: 256
      recommended_memory_mb: 512
      min_cpus: 1
    container:
      image: dpage/pgadmin4:8
      environment:
        # pgAdmin rejects reserved domains such as .local in the login email.
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: changeme
        PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      ports:
        - container: 80
          host: 8150
          protocol: tcp
      volumes:
        - /var/lib/pgadmin
      files:
        # Pre-registers the recipe's database; pgAdmin imports it on first
        # start only (the password is still prompted on connect).
        - path: /pgadmin4/servers.json
          content: |
            {
              "Servers": {
                "1": {
                  "Name": "postgresql",
                  "Group": "Servers",
                  "Host": "postgresql",
                  "Port": 5432,
                  "MaintenanceDB": "appdb",
                  "Username": "appuser",
                  "SSLMode": "prefer"
                }
              }
            }
    outputs:
      instructions: pgAdmin is running on http://localhost:8150 (admin@example.com / changeme); the "postgresql" server is pre-registered.
