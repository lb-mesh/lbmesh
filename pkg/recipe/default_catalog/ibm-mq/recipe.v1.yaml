recipe: v1
metadata:
  name: ibm-mq
  category: messaging
  description: IBM MQ queue manager (developer configuration) with the web console.
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 512
  recommended_memory_mb: 1024
  min_cpus: 1
container:
  image: icr.io/ibm-messaging/mq:latest
  environment:
    LICENSE: accept
    MQ_QMGR_NAME: QM1
    MQ_DEV: "true"
    MQ_ADMIN_PASSWORD: changeme
    MQ_APP_PASSWORD: changeme
  ports:
    - container: 1414
      host: 1414
      protocol: tcp
    - container: 9443
      host: 9443
      protocol: tcp
  volumes:
    - /mnt/mqm
outputs:
  env:
    MQ_QMGR_NAME: QM1
    MQ_CONN_NAME: localhost(1414)
    MQ_CHANNEL: DEV.APP.SVRCONN
    MQ_APP_USER: app
    MQ_APP_PASSWORD: changeme
  instructions: IBM MQ queue manager QM1 is listening on localhost:1414; web console at https://localhost:9443/ibmmq/console (admin / changeme). The image is amd64-only and runs under emulation on Apple Silicon.
