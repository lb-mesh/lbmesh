recipe: v1
metadata:
  name: cassandra
  category: database
  description: Apache Cassandra wide-column database (single node).
  scope: system
  version: "1.0.0"
resources:
  min_memory_mb: 1536
  recommended_memory_mb: 3072
  min_cpus: 2
container:
  image: cassandra:4.1
  environment:
    CASSANDRA_CLUSTER_NAME: lbmesh-cassandra
    MAX_HEAP_SIZE: 1G
    HEAP_NEWSIZE: 256M
  ports:
    - container: 9042
      host: 9042
      protocol: tcp
  volumes:
    - /var/lib/cassandra
outputs:
  env:
    CASSANDRA_CONTACT_POINTS: localhost:9042
  instructions: Cassandra is running on localhost:9042 (CQL); first start can take a minute.
