# .goreleaser.yaml — lbmesh cross-platform release configuration
# Run: goreleaser release --clean
# Dry-run: goreleaser build --snapshot --clean
version: 2

project_name: lbmesh

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: lbmesh
    main: ./cmd/lbmesh
    binary: lbmesh
    env:
      - CGO_ENABLED=0
    ldflags:
      # Strip symbol table and DWARF debug info to minimise binary size.
      - -s -w
      - -X github.com/lbmesh/lbmesh-v2/internal/version.Version={{.Version}}
      - -X github.com/lbmesh/lbmesh-v2/internal/version.Commit={{.Commit}}
      - -X github.com/lbmesh/lbmesh-v2/internal/version.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude windows/arm64 — not a common target for local dev tooling.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: lbmesh
    builds:
      - lbmesh
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: true
  prerelease: auto
